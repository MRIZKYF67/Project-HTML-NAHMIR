<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel HTML</title>
</head>
<body>

    <h1>Membuat Tabel</h1>

    <!-- 1. Tabel Standar -->
    <h4>Tabel Standar</h4>
    <table border="1">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
    </table>
    <br>

    <!-- 2. Tabel dengan Header -->
    <h4>Tabel Dengan Header</h4>

    <!-- Header di Kiri -->
    <table border="1">
        <tr>
            <th>Senin</th>
            <td>10.00</td>
            <td>12.00</td>
            <td>14.00</td>
        </tr>
    </table>

    <br>

    <!-- Header di Atas -->
    <table border="1">
        <tr>
            <th>Senin</th>
            <th>Selasa</th>
        </tr>
        <tr>
            <td>10.00</td>
            <td>10.00</td>
        </tr>
        <tr>
            <td>11.00</td>
            <td>11.00</td>
        </tr>
    </table>

    <br>

    <!-- Gabungan Header Samping dan Isi -->
    <table border="1">
        <tr>
            <th>Senin</th>
            <td>Berangkat sekolah</td>
        </tr>
        <tr>
            <th>12.00</th>
            <td>Makan siang</td>
        </tr>
    </table>

    <br>

    <!-- 3. Alokasi Kolom & Baris (Colspan & Rowspan) -->
    <h4>Alokasi Kolom (Colspan & Rowspan)</h4>
    <table border="1">
        <tr>
            <th>Senin</th>
            <th>Selasa</th>
        </tr>
        <tr>
            <td>Berangkat sekolah</td>
            <td>Olahraga</td>
        </tr>
        <tr>
            <th rowspan="2">12.00</th>
            <td colspan="2">Makan siang</td>
        </tr>
        <tr>
            <td colspan="2">Sholat Dhuhur</td>
        </tr>
    </table>

</body>
</html>
